name: Build Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix SDK Naming
        run: |
          echo "Исправляем названия файлов SDK..."
          
          # 1. Переименовываем файлы в папке SDK
          cd HMOOD/SDK || exit 1
          for file in Dolphin-Plus_*; do
            if [ -f "$file" ]; then
              # Меняем Dolphin-Plus_ на SHANKS_PUBGM_
              new_name=$(echo "$file" | sed 's/Dolphin-Plus_/SHANKS_PUBGM_/g')
              mv "$file" "$new_name"
              echo "Переименован: $file -> $new_name"
            fi
          done
          cd ../..
          
          # 2. Меняем пути внутри самого проекта Xcode
          PROJECT_FILE=$(find . -name "project.pbxproj" | head -n 1)
          if [ -n "$PROJECT_FILE" ]; then
            # Заменяем упоминания Dolphin-Plus на SHANKS_PUBGM
            sed -i '' 's/Dolphin-Plus/SHANKS_PUBGM/g' "$PROJECT_FILE"
            echo "Обновлен файл проекта: $PROJECT_FILE"
          fi

      - name: Find and Build Xcode Project
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "ОШИБКА: Файл .xcodeproj не найден!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          PROJECT_NAME=$(basename "$PROJECT_PATH")
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          
          SCHEME=$(xcodebuild -list -project "$PROJECT_NAME" -json | jq -r '.project.schemes[0]')
          echo "Собираем схему: $SCHEME"
          
          xcodebuild -project "$PROJECT_NAME" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -derivedDataPath ./build

      - name: Extract binary and rename to dylib
        run: |
          cd "$PROJECT_DIR"
          BUILD_DIR=$(find . -type d -path "*/Build/Products/Release-iphoneos" | head -n 1)
          
          if [ -z "$BUILD_DIR" ]; then
            echo "ОШИБКА: Папка с результатами сборки не найдена!"
            exit 1
          fi
          
          cd "$BUILD_DIR"
          FRAMEWORK_DIR=$(find . -maxdepth 1 -name "*.framework" | head -n 1)
          
          if [ -n "$FRAMEWORK_DIR" ]; then
            FRAMEWORK_NAME=$(basename "$FRAMEWORK_DIR" .framework)
            echo "Найден фреймворк: $FRAMEWORK_NAME"
            cp "$FRAMEWORK_DIR/$FRAMEWORK_NAME" "./$FRAMEWORK_NAME.dylib"
            echo "Успешно создан $FRAMEWORK_NAME.dylib"
          else
            find . -name "*.dylib" -exec cp {} ./ \;
          fi
          
          cd "$GITHUB_WORKSPACE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-dylib
          path: "**/*.dylib"