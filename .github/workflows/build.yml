name: Build Dylib with Theos
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: randomblock1/theos-action@v1
        with:
          theos-path: /opt/theos

      - name: Fix SDK Naming (адаптация под Theos)
        run: |
          export LC_ALL=C
          echo "Адаптируем файлы SDK..."
          # Переименовываем файлы из Dolphin-Plus в SHANKS_PUBGM
          cd HMOOD/SDK || exit 1
          for file in Dolphin-Plus_*; do
            if [ -f "$file" ]; then
              mv "$file" "$(echo "$file" | sed 's/Dolphin-Plus_/SHANKS_PUBGM_/g')"
            fi
          done
          cd ../..
          # Заменяем старые названия внутри всех файлов кода
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.mm" \) -exec sed -i '' 's/Dolphin-Plus_/SHANKS_PUBGM_/g' {} +

      - name: Build with Theos
        run: |
          # Собираем проект
          make
          # Копируем готовый файл для артефакта
          cp .theos/obj/HMOOD_FUCK_MAX.dylib ./final.dylib || cp .theos/obj/debug/HMOOD_FUCK_MAX.dylib ./final.dylib

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: HMOOD_FUCK_MAX-dylib
          path: final.dylib