name: Build Framework with Theos
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: randomblock1/theos-action@v1
        with:
          theos-path: ${{ github.workspace }}/theos

      - name: Fix SDK Naming
        run: |
          export LC_ALL=C
          echo "Адаптируем файлы SDK..."
          cd HMOOD/SDK || exit 1
          for file in Dolphin-Plus_*; do
            if [ -f "$file" ]; then
              mv "$file" "$(echo "$file" | sed 's/Dolphin-Plus_/SHANKS_PUBGM_/g')"
            fi
          done
          cd ../..
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.mm" \) -exec sed -i '' 's/Dolphin-Plus_/SHANKS_PUBGM_/g' {} +

      - name: Build Framework with Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make

      - name: Find and Prepare Framework
        run: |
          # Ищем собранный фреймворк
          FW_PATH=$(find .theos -name "HMOOD_FUCK_MAX.framework" -type d | head -n 1)
          if [ -z "$FW_PATH" ]; then
            echo "ОШИБКА: .framework не найден!"
            find .theos -name "*.framework" -type d
            exit 1
          fi
          echo "Найден фреймворк: $FW_PATH"
          
          # Проверяем содержимое
          ls -la "$FW_PATH"
          
          # Копируем в корень для загрузки
          cp -R "$FW_PATH" ./HMOOD_FUCK_MAX.framework
          
          # Упаковываем в zip, чтобы GitHub не поломал структуру папки при загрузке
          zip -r HMOOD_FUCK_MAX.framework.zip HMOOD_FUCK_MAX.framework

      - name: Upload Framework
        uses: actions/upload-artifact@v4
        with:
          name: HMOOD_FUCK_MAX-framework
          path: HMOOD_FUCK_MAX.framework.zip