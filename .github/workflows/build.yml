name: Build Dylib with Theos
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: randomblock1/theos-action@v1
        with:
          theos-path: ${{ github.workspace }}/theos

      - name: Fix SDK Naming
        run: |
          export LC_ALL=C
          echo "Адаптируем файлы SDK..."
          cd HMOOD/SDK || exit 1
          for file in Dolphin-Plus_*; do
            if [ -f "$file" ]; then
              mv "$file" "$(echo "$file" | sed 's/Dolphin-Plus_/SHANKS_PUBGM_/g')"
            fi
          done
          cd ../..
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.mm" \) -exec sed -i '' 's/Dolphin-Plus_/SHANKS_PUBGM_/g' {} +

      - name: Build with Theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make

      - name: Find and Upload Dylib
        run: |
          # Ищем собранный dylib в любых местах, где его может сохранить Theos
          DYLIB_PATH=$(find .theos -name "HMOOD_FUCK_MAX.dylib" -type f | head -n 1)
          if [ -z "$DYLIB_PATH" ]; then
            echo "ОШИБКА: .dylib не найден!"
            find .theos -name "*.dylib"
            exit 1
          fi
          echo "Найден файл: $DYLIB_PATH"
          cp "$DYLIB_PATH" ./final.dylib
          ls -la ./final.dylib

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: HMOOD_FUCK_MAX-dylib
          path: final.dylib