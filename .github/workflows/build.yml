name: Build Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        run: |
          cd "FUCK S0N_MX BY HMOOD"
          SCHEME=$(xcodebuild -list -json | jq -r '.project.schemes[0]')
          echo "Building scheme: $SCHEME"
          xcodebuild -project HMOOD_FUCK_MAX.xcodeproj -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -derivedDataPath ./build

      - name: Upload EVERYTHING
        uses: actions/upload-artifact@v4
        with:
          name: all-build-files
          # Скачиваем всю папку с результатами сборки
          path: "FUCK S0N_MX BY HMOOD/build/Build/Products/**"