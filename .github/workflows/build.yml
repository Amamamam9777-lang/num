name: Unzip Project Files
on:
  push:
    branches: [ main ] # или master, в зависимости от вашей ветки

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение на запись файлов в репозиторий
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Find and Extract ZIP
        run: |
          # Ищем первый попавшийся zip-файл
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Zip file not found!"
            exit 1
          fi
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d .
          # Удаляем архив после распаковки (по желанию)
          rm "$ZIP_FILE"
      
      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-unzip project files" || echo "No changes to commit"
          git push
